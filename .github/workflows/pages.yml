name: Deploy the game to GitHub Pages

# Publishes www/ (the game) and the privacy policy to
# https://<your-username>.github.io/<repo-name>/ on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r www/. _site/
          cp docs/privacy-policy.html _site/privacy-policy.html
          touch _site/.nojekyll

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
